
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COF Normal</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            touch-action: manipulation;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef1f5;
            color: #000000;
        }

        button,
        input {
            font: inherit;
        }

        button {
            touch-action: manipulation;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header {
            max-width: 700px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 14px;
        }

        .btn {
            border: 0;
            border-radius: 11px;
            padding: 13px 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-green {
            background: #dcfce7;
            color: #166534;
        }

        .btn-edit {
            background: #fef3c7;
            color: #92400e;
        }

        .titulo-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .titulo-area h2 {
            margin: 0;
            font-size: 20px;
        }

        .dias {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dia-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
            cursor: pointer;
            border: 1px solid #e5e7eb;
        }

        .dia-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .dia-data {
            font-size: 18px;
            font-weight: bold;
        }

        .dia-nome {
            font-size: 15px;
            font-weight: bold;
            margin-top: 5px;
            color: #374151;
        }

        .seta {
            font-size: 22px;
            color: #6b7280;
        }

        .dia-info {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            padding: 6px 9px;
            border-radius: 8px;
            background: #f3f4f6;
            font-size: 13px;
            font-weight: bold;
        }

        .tag-blue {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .tag-green {
            background: #dcfce7;
            color: #15803d;
        }

        .tag-gray {
            background: #f3f4f6;
            color: #4b5563;
        }

        .vazio {
            text-align: center;
            padding: 35px 15px;
            color: #6b7280;
            background: white;
            border-radius: 15px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 13px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="date"],
        input[type="text"],
        input[type="number"] {
            width: 100%;
            height: 48px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 12px;
            outline: none;
            background: #fafafa;
        }

        input:focus {
            border-color: #2563eb;
            background: white;
        }

        .campo {
            margin-bottom: 13px;
        }

        .foto-btn {
            width: 100%;
            height: 48px;
            border: 2px dashed #9ca3af;
            border-radius: 10px;
            background: #f9fafb;
            font-weight: bold;
        }

        .preview {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 10px;
            background: #f3f4f6;
        }

        .voltar {
            margin-bottom: 12px;
        }

        .dia-header {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 13px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
        }

        .dia-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .dia-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .nome-header {
            margin-top: 6px;
            color: #4b5563;
            font-weight: bold;
        }

        .header-acoes {
            display: flex;
            gap: 6px;
        }

        .foto-dia {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 12px;
            background: #f3f4f6;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 7px;
        }

        .campo-mini label {
            text-align: center;
        }

        .campo-mini input {
            text-align: center;
        }

        .adicionar {
            width: 100%;
            height: 54px;
            margin-top: 12px;
            border: 0;
            border-radius: 11px;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .cancelar-edicao {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: 0;
            border-radius: 11px;
            background: #e5e7eb;
            color: #111827;
            font-weight: bold;
        }

        .tabela-header,
        .linha {
            display: grid;
            grid-template-columns: 28px 1.5fr 1fr 1fr 34px 34px;
            gap: 5px;
            align-items: center;
        }

        .tabela-header {
            color: #6b7280;
            font-size: 12px;
            font-weight: bold;
            padding: 0 5px 6px;
        }

        .linha {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 8px 5px;
            margin-bottom: 7px;
        }

        .linha span {
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .numero {
            color: #6b7280;
            font-size: 12px;
        }

        .valor {
            font-weight: bold;
        }

        .excluir,
        .editar-cof {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
        }

        .excluir {
            background: #fee2e2;
            color: #dc2626;
        }

        .editar-cof {
            background: #fef3c7;
            color: #92400e;
        }

        .acoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .backup-acoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .contador {
            background: #374151;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .mensagem {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            background: #111827;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .2);
        }

        @media(max-width:500px) {
            main {
                padding: 10px;
            }

            .inputs-grid {
                grid-template-columns: 1.35fr 1fr 1fr;
            }

            .linha {
                grid-template-columns: 28px 1.5fr 1fr 1fr 32px 32px;
            }

            .tabela-header {
                grid-template-columns: 28px 1.5fr 1fr 1fr 32px 32px;
            }

            .linha,
            .campo-mini input {
                font-size: 14px;
            }
        }
    </style>

    <!-- Biblioteca para criar Excel .XLSX -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

</head>

<body>

<header>
    <div class="header">
        <div class="logo">📋 COF NORMAL</div>
        <button class="btn btn-secondary" type="button" onclick="voltarInicio()">
            ← VOLTAR
        </button>
    </div>
</header>

<main id="app"></main>

<div id="mensagem" class="mensagem"></div>

<input
    id="arquivoBackup"
    type="file"
    accept=".json,application/json"
    hidden
>

<script>

let dias = [];
let diaAtualId = null;
let fotoTemporaria = "";
let cofEditandoId = null;
let acaoEmAndamento = false;

const CHAVE = "cof_dias_normal";


/* =========================
   FUNÇÕES GERAIS
========================= */

function salvarDados() {
    localStorage.setItem(CHAVE, JSON.stringify(dias));
}


function carregarDados() {
    try {
        const dados = localStorage.getItem(CHAVE);

        if (dados) {
            dias = JSON.parse(dados);

            if (!Array.isArray(dias)) {
                dias = [];
            }
        } else {
            dias = [];
        }

    } catch (erro) {
        console.error(erro);
        dias = [];
    }
}


function dataHoje() {
    const agora = new Date();

    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, "0");
    const dia = String(agora.getDate()).padStart(2, "0");

    return `${ano}-${mes}-${dia}`;
}


function formatarData(data) {

    if (!data) return "";

    const partes = data.split("-");

    if (partes.length !== 3) {
        return data;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


function mostrarMensagem(texto) {

    const mensagem = document.getElementById("mensagem");

    mensagem.textContent = texto;
    mensagem.style.display = "block";

    clearTimeout(window.timerMensagem);

    window.timerMensagem = setTimeout(() => {
        mensagem.style.display = "none";
    }, 2200);
}


function escapar(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   INÍCIO
========================= */

function voltarInicio() {

    diaAtualId = null;
    cofEditandoId = null;
    fotoTemporaria = "";

    telaInicial();
}


function telaInicial() {

    diaAtualId = null;

    const ordenados = [...dias].sort((a, b) => {

        const dataA = new Date(a.data + "T00:00:00");
        const dataB = new Date(b.data + "T00:00:00");

        return dataB - dataA;
    });

    let html = `

        <div class="titulo-area">

            <h2>📅 Histórico</h2>

            <span class="contador">
                ${dias.length} dia${dias.length === 1 ? "" : "s"}
            </span>

        </div>

        <button
            class="btn btn-primary"
            type="button"
            onclick="novoDia()"
        >
            ＋ NOVA ANÁLISE
        </button>

        <div style="height:12px"></div>

    `;


    if (ordenados.length === 0) {

        html += `
            <div class="vazio">
                <div style="font-size:35px">📋</div>
                <strong>Nenhuma análise criada.</strong>
                <div style="margin-top:6px">
                    Clique em "NOVA ANÁLISE" para começar.
                </div>
            </div>
        `;

    } else {

        html += `<div class="dias">`;

        ordenados.forEach(dia => {

            const quantidade = dia.registros?.length || 0;

            html += `

                <div
                    class="dia-card"
                    onclick="abrirDia(${dia.id})"
                >

                    <div class="dia-topo">

                        <div>

                            <div class="dia-data">
                                ${formatarData(dia.data)}
                            </div>

                            <div class="dia-nome">
                                ${escapar(dia.nome || "Sem nome")}
                            </div>

                        </div>

                        <div class="seta">
                            →
                        </div>

                    </div>

                    <div class="dia-info">

                        <span class="tag tag-blue">
                            ${quantidade} COF
                        </span>

                        <span class="tag tag-gray">
                            ${dia.foto ? "📷 Com foto" : "📷 Sem foto"}
                        </span>

                    </div>

                </div>

            `;

        });

        html += `</div>`;
    }


    document.getElementById("app").innerHTML = html;
}


/* =========================
   NOVO DIA
========================= */

function novoDia() {

    fotoTemporaria = "";

    document.getElementById("app").innerHTML = `

        <button
            class="btn btn-secondary voltar"
            type="button"
            onclick="telaInicial()"
        >
            ← VOLTAR
        </button>

        <div class="card">

            <h2>➕ Nova análise</h2>

            <div class="campo">

                <label>
                    NOME DA ANÁLISE / EMPRESA
                </label>

                <input
                    id="nomeDia"
                    type="text"
                    placeholder="Digite o nome"
                    autocomplete="off"
                >

            </div>


            <div class="campo">

                <label>
                    DATA
                </label>

                <input
                    id="dataDia"
                    type="date"
                    value="${dataHoje()}"
                >

            </div>


            <div class="campo">

                <label>
                    FOTO DO PRODUTO
                </label>

                <button
                    class="foto-btn"
                    type="button"
                    onclick="selecionarFoto()"
                >
                    📷 ESCOLHER FOTO
                </button>

                <img
                    id="previewFoto"
                    class="preview"
                >

            </div>


            <button
                class="btn btn-primary"
                type="button"
                onclick="criarDia()"
            >
                CRIAR ANÁLISE
            </button>

        </div>

        <input
            id="arquivoFoto"
            type="file"
            accept="image/*"
            hidden
            onchange="processarFoto(event)"
        >

    `;

    document.getElementById("nomeDia").focus();
}


function selecionarFoto() {

    const arquivo = document.getElementById("arquivoFoto");

    if (arquivo) {
        arquivo.click();
    }
}


function processarFoto(event) {

    const arquivo = event.target.files[0];

    if (!arquivo) return;

    const leitor = new FileReader();

    leitor.onload = function(e) {

        fotoTemporaria = e.target.result;

        const preview = document.getElementById("previewFoto");

        if (preview) {

            preview.src = fotoTemporaria;
            preview.style.display = "block";

        }
    };

    leitor.readAsDataURL(arquivo);
}


function criarDia() {

    if (acaoEmAndamento) return;

    acaoEmAndamento = true;

    const nome = document.getElementById("nomeDia")?.value.trim();
    const data = document.getElementById("dataDia")?.value;

    if (!nome) {

        alert("Digite o nome da análise.");

        acaoEmAndamento = false;
        return;
    }


    if (!data) {

        alert("Escolha a data.");

        acaoEmAndamento = false;
        return;
    }


    const novo = {

        id: Date.now(),

        nome: nome,

        data: data,

        foto: fotoTemporaria || "",

        registros: []

    };


    dias.push(novo);

    salvarDados();

    diaAtualId = novo.id;

    fotoTemporaria = "";

    cofEditandoId = null;

    abrirDia(novo.id);

    setTimeout(() => {
        acaoEmAndamento = false;
    }, 400);
}


/* =========================
   ABRIR DIA
========================= */

function abrirDia(id) {

    const dia = dias.find(d => d.id === id);

    if (!dia) return;

    diaAtualId = id;
    cofEditandoId = null;

    renderizarDia();
}


function renderizarDia() {

    const dia = dias.find(d => d.id === diaAtualId);

    if (!dia) {

        telaInicial();
        return;
    }


    const registros = dia.registros || [];

    let html = `

        <button
            class="btn btn-secondary voltar"
            type="button"
            onclick="telaInicial()"
        >
            ← HISTÓRICO
        </button>


        <div class="dia-header">

            <div class="dia-header-top">

                <div>

                    <h2>
                        ${formatarData(dia.data)}
                    </h2>

                    <div class="nome-header">
                        ${escapar(dia.nome || "Sem nome")}
                    </div>

                </div>


                <div class="header-acoes">

                    <button
                        class="btn btn-edit"
                        type="button"
                        onclick="editarDia()"
                    >
                        ✏️
                    </button>

                    <button
                        class="btn btn-danger"
                        type="button"
                        onclick="excluirDia()"
                    >
                        🗑️
                    </button>

                </div>

            </div>


            ${
                dia.foto
                ?
                `<img class="foto-dia" src="${dia.foto}">`
                :
                ""
            }

        </div>


        <div class="card">

            <h2>
                ${cofEditandoId ? "✏️ Editar COF" : "➕ Adicionar COF"}
            </h2>


            <div class="inputs-grid">

                <div class="campo-mini">

                    <label>
                        BOBINA
                    </label>

                    <input
                        id="bobina"
                        type="text"
                        autocomplete="off"
                        placeholder="Bobina"
                    >

                </div>


                <div class="campo-mini">

                    <label>
                        FXF
                    </label>

                    <input
                        id="fxf"
                        type="text"
                        inputmode="decimal"
                        autocomplete="off"
                        placeholder="FXF"
                    >

                </div>


                <div class="campo-mini">

                    <label>
                        VXV
                    </label>

                    <input
                        id="vxv"
                        type="text"
                        inputmode="decimal"
                        autocomplete="off"
                        placeholder="VXV"
                    >

                </div>

            </div>


            <button
                class="adicionar"
                type="button"
                onclick="adicionarCOF()"
            >
                ${
                    cofEditandoId
                    ?
                    "💾 SALVAR ALTERAÇÃO"
                    :
                    "＋ ADICIONAR COF"
                }
            </button>


            ${
                cofEditandoId
                ?
                `
                <button
                    class="cancelar-edicao"
                    type="button"
                    onclick="cancelarEdicao()"
                >
                    CANCELAR EDIÇÃO
                </button>
                `
                :
                ""
            }

        </div>


        <div class="card">

            <h2>
                📋 COFs
                <span class="tag tag-blue">
                    ${registros.length}
                </span>
            </h2>


            ${
                registros.length === 0
                ?
                `
                <div class="vazio">
                    Nenhum COF adicionado ainda.
                </div>
                `
                :
                `
                <div class="tabela-header">

                    <span>#</span>
                    <span>BOBINA</span>
                    <span>FXF</span>
                    <span>VXV</span>
                    <span>✏️</span>
                    <span>🗑️</span>

                </div>

                ${gerarTabela(registros)}
                `
            }

        </div>


        <div class="card">

            <div class="acoes">

                <button
                    class="btn btn-green"
                    type="button"
                    onclick="exportarDiaExcel(${dia.id})"
                >
                    📊 PLANILHA
                </button>

                <button
                    class="btn btn-danger"
                    type="button"
                    onclick="limparCOF()"
                >
                    🧹 LIMPAR COF
                </button>

            </div>


            <div class="backup-acoes">

                <button
                    class="btn btn-secondary"
                    type="button"
                    onclick="fazerBackup()"
                >
                    💾 BACKUP
                </button>

                <button
                    class="btn btn-secondary"
                    type="button"
                    onclick="abrirRestauracao()"
                >
                    ♻️ RESTAURAR
                </button>

            </div>

        </div>

    `;


    document.getElementById("app").innerHTML = html;

    configurarEnter();


    if (cofEditandoId) {

        const registro = registros.find(
            r => r.id === cofEditandoId
        );

        if (registro) {

            document.getElementById("bobina").value =
                registro.bobina || "";

            document.getElementById("fxf").value =
                registro.fxf || "";

            document.getElementById("vxv").value =
                registro.vxv || "";

        }

    }


    setTimeout(() => {

        const campo = document.getElementById("bobina");

        if (campo) {
            campo.focus();
        }

    }, 100);
}


/* =========================
   TABELA
========================= */

function gerarTabela(registros) {

    return registros.map((registro, indice) => {

        return `

            <div class="linha">

                <span class="numero">
                    ${indice + 1}
                </span>

                <span class="valor">
                    ${escapar(registro.bobina)}
                </span>

                <span>
                    ${escapar(registro.fxf)}
                </span>

                <span>
                    ${escapar(registro.vxv)}
                </span>

                <button
                    class="editar-cof"
                    type="button"
                    onclick="editarCOF(${registro.id})"
                >
                    ✏️
                </button>

                <button
                    class="excluir"
                    type="button"
                    onclick="excluirCOF(${registro.id})"
                >
                    🗑️
                </button>

            </div>

        `;

    }).join("");
}


/* =========================
   ADICIONAR / EDITAR COF
========================= */

function adicionarCOF() {

    if (acaoEmAndamento) return;

    acaoEmAndamento = true;

    const dia = dias.find(d => d.id === diaAtualId);

    if (!dia) {

        acaoEmAndamento = false;
        return;
    }


    const bobina =
        document.getElementById("bobina")?.value.trim();

    const fxf =
        document.getElementById("fxf")?.value.trim();

    const vxv =
        document.getElementById("vxv")?.value.trim();


    if (!bobina) {

        alert("Digite a BOBINA.");

        acaoEmAndamento = false;
        return;
    }


    if (!fxf && !vxv) {

        alert("Digite pelo menos FXF ou VXV.");

        acaoEmAndamento = false;
        return;
    }


    if (cofEditandoId) {

        const registro = dia.registros.find(
            r => r.id === cofEditandoId
        );

        if (registro) {

            registro.bobina = bobina;
            registro.fxf = fxf;
            registro.vxv = vxv;

        }

        cofEditandoId = null;

        salvarDados();

        mostrarMensagem("COF alterado!");

    } else {

        dia.registros.push({

            id: Date.now(),

            bobina: bobina,

            fxf: fxf,

            vxv: vxv

        });

        salvarDados();

        mostrarMensagem("COF adicionado!");

    }


    renderizarDia();

    setTimeout(() => {
        acaoEmAndamento = false;
    }, 350);
}


function editarCOF(id) {

    cofEditandoId = id;

    renderizarDia();
}


function cancelarEdicao() {

    cofEditandoId = null;

    renderizarDia();
}


function excluirCOF(id) {

    if (!confirm("Excluir este COF?")) {
        return;
    }


    const dia = dias.find(d => d.id === diaAtualId);

    if (!dia) return;


    dia.registros =
        dia.registros.filter(r => r.id !== id);


    salvarDados();

    mostrarMensagem("COF excluído!");

    renderizarDia();
}


function limparCOF() {

    const dia = dias.find(d => d.id === diaAtualId);

    if (!dia) return;


    if (dia.registros.length === 0) {

        alert("Não há COFs para limpar.");

        return;
    }


    if (!confirm("Apagar TODOS os COFs desta análise?")) {
        return;
    }


    dia.registros = [];

    cofEditandoId = null;

    salvarDados();

    mostrarMensagem("COFs apagados!");

    renderizarDia();
}


/* =========================
   EDITAR DIA
========================= */

function editarDia() {

    const dia = dias.find(d => d.id === diaAtualId);

    if (!dia) return;


    fotoTemporaria = dia.foto || "";


    document.getElementById("app").innerHTML = `

        <button
            class="btn btn-secondary voltar"
            type="button"
            onclick="renderizarDia()"
        >
            ← CANCELAR
        </button>


        <div class="card">

            <h2>✏️ Editar análise</h2>


            <div class="campo">

                <label>
                    NOME DA ANÁLISE / EMPRESA
                </label>

                <input
                    id="nomeDia"
                    type="text"
                    value="${escapar(dia.nome || "")}"
                    autocomplete="off"
                >

            </div>


            <div class="campo">

                <label>
                    DATA
                </label>

                <input
                    id="dataDia"
                    type="date"
                    value="${dia.data}"
                >

            </div>


            <div class="campo">

                <label>
                    FOTO DO PRODUTO
                </label>

                <button
                    class="foto-btn"
                    type="button"
                    onclick="selecionarFotoEdicao()"
                >
                    📷 TROCAR FOTO
                </button>


                ${
                    dia.foto
                    ?
                    `<img
                        id="previewFoto"
                        class="preview"
                        style="display:block"
                        src="${dia.foto}"
                    >`
                    :
                    `<img
                        id="previewFoto"
                        class="preview"
                    >`
                }

            </div>


            <button
                class="btn btn-primary"
                type="button"
                onclick="salvarEdicaoDia()"
            >
                💾 SALVAR ALTERAÇÕES
            </button>

        </div>


        <input
            id="arquivoFoto"
            type="file"
            accept="image/*"
            hidden
            onchange="processarFotoEdicao(event)"
        >

    `;
}


function selecionarFotoEdicao() {

    document.getElementById("arquivoFoto")?.click();
}


function processarFotoEdicao(event) {

    const arquivo = event.target.files[0];

    if (!arquivo) return;


    const leitor = new FileReader();

    leitor.onload = function(e) {

        fotoTemporaria = e.target.result;

        const preview =
            document.getElementById("previewFoto");

        if (preview) {

            preview.src = fotoTemporaria;
            preview.style.display = "block";

        }

    };

    leitor.readAsDataURL(arquivo);
}


function salvarEdicaoDia() {

    const dia = dias.find(d => d.id === diaAtualId);

    if (!dia) return;


    const nome =
        document.getElementById("nomeDia")?.value.trim();

    const data =
        document.getElementById("dataDia")?.value;


    if (!nome) {

        alert("Digite o nome da análise.");

        return;
    }


    if (!data) {

        alert("Escolha a data.");

        return;
    }


    dia.nome = nome;
    dia.data = data;
    dia.foto = fotoTemporaria || "";


    salvarDados();

    fotoTemporaria = "";

    mostrarMensagem("Análise atualizada!");

    renderizarDia();
}


/* =========================
   EXCLUIR DIA
========================= */

function excluirDia() {

    const dia = dias.find(d => d.id === diaAtualId);

    if (!dia) return;


    if (
        !confirm(
            `Excluir a análise "${dia.nome}" e todos os seus COFs?`
        )
    ) {
        return;
    }


    dias = dias.filter(d => d.id !== diaAtualId);

    salvarDados();

    diaAtualId = null;

    mostrarMensagem("Análise excluída!");

    telaInicial();
}


/* =========================
   ENTER NOS CAMPOS
========================= */

function configurarEnter() {

    const bobina = document.getElementById("bobina");
    const fxf = document.getElementById("fxf");
    const vxv = document.getElementById("vxv");


    if (!bobina || !fxf || !vxv) return;


    bobina.addEventListener("keydown", function(e) {

        if (e.key === "Enter") {

            e.preventDefault();

            fxf.focus();
        }

    });


    fxf.addEventListener("keydown", function(e) {

        if (e.key === "Enter") {

            e.preventDefault();

            vxv.focus();
        }

    });


    vxv.addEventListener("keydown", function(e) {

        if (e.key === "Enter") {

            e.preventDefault();

            adicionarCOF();
        }

    });
}


/* =========================
   EXPORTAR EXCEL XLSX
========================= */

async function exportarDiaExcel(id) {

    const dia = dias.find(d => d.id === id);

    if (!dia) return;


    if (!dia.registros || dia.registros.length === 0) {

        alert("Não há COF para exportar.");

        return;
    }


    if (typeof ExcelJS === "undefined") {

        alert(
            "A biblioteca do Excel não carregou. " +
            "Verifique sua conexão com a internet e tente novamente."
        );

        return;
    }


    try {

        mostrarMensagem("Gerando planilha...");


        const workbook = new ExcelJS.Workbook();

        workbook.creator = "Controle COF";
        workbook.lastModifiedBy = "Controle COF";

        const worksheet =
            workbook.addWorksheet("COF");


        /* =========================
           COLUNAS
        ========================= */

        worksheet.columns = [

            {
                header: "BOBINA",
                key: "bobina",
                width: 20
            },

            {
                header: "FXF",
                key: "fxf",
                width: 15
            },

            {
                header: "VXV",
                key: "vxv",
                width: 15
            }

        ];


        /* =========================
           CABEÇALHO
        ========================= */

        const header =
            worksheet.getRow(1);


        header.height = 22;


        header.eachCell(cell => {

            cell.font = {
                name: "Calibri",
                size: 11,
                bold: true,
                color: {
                    argb: "FFFFFFFF"
                }
            };


            cell.fill = {

                type: "pattern",

                pattern: "solid",

                fgColor: {
                    argb: "FF1F4E78"
                }

            };


            cell.alignment = {

                horizontal: "center",

                vertical: "middle"

            };


            cell.border = {

                top: {
                    style: "thin",
                    color: {
                        argb: "FF000000"
                    }
                },

                left: {
                    style: "thin",
                    color: {
                        argb: "FF000000"
                    }
                },

                bottom: {
                    style: "thin",
                    color: {
                        argb: "FF000000"
                    }
                },

                right: {
                    style: "thin",
                    color: {
                        argb: "FF000000"
                    }
                }

            };

        });


        /* =========================
           DADOS
        ========================= */

        dia.registros.forEach(registro => {

            const row = worksheet.addRow({

                bobina: registro.bobina || "",

                fxf: registro.fxf || "",

                vxv: registro.vxv || ""

            });


            row.eachCell(cell => {

                cell.font = {

                    name: "Calibri",

                    size: 11,

                    bold: false

                };


                cell.alignment = {

                    horizontal: "center",

                    vertical: "middle"

                };


                cell.border = {

                    top: {
                        style: "thin",
                        color: {
                            argb: "FF000000"
                        }
                    },

                    left: {
                        style: "thin",
                        color: {
                            argb: "FF000000"
                        }
                    },

                    bottom: {
                        style: "thin",
                        color: {
                            argb: "FF000000"
                        }
                    },

                    right: {
                        style: "thin",
                        color: {
                            argb: "FF000000"
                        }
                    }

                };

            });

        });


        /* =========================
           FILTRO
        ========================= */

        worksheet.autoFilter = {

            from: "A1",

            to: `C${dia.registros.length + 1}`

        };


        /* =========================
           CONGELAR CABEÇALHO
        ========================= */

        worksheet.views = [

            {
                state: "frozen",

                ySplit: 1

            }

        ];


        /* =========================
           GERA ARQUIVO
        ========================= */

        const buffer =
            await workbook.xlsx.writeBuffer();


        const blob = new Blob(
            [buffer],
            {
                type:
                    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            }
        );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;


        link.download =
            `COF_${dia.data}.xlsx`;


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        URL.revokeObjectURL(url);


        mostrarMensagem("Planilha Excel criada!");

    } catch (erro) {

        console.error(erro);

        alert(
            "Não foi possível criar a planilha Excel."
        );

    }

}


/* =========================
   BACKUP
========================= */

function fazerBackup() {

    const backup = {

        tipo: "COF_NORMAL",

        versao: 3,

        dataBackup:
            new Date().toISOString(),

        dados: dias

    };


    const blob = new Blob(

        [
            JSON.stringify(
                backup,
                null,
                2
            )
        ],

        {
            type: "application/json"
        }

    );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        `BACKUP_COF_NORMAL_${dataHoje()}.json`;


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    URL.revokeObjectURL(url);


    mostrarMensagem("Backup criado!");
}


function abrirRestauracao() {

    document
        .getElementById("arquivoBackup")
        .click();
}


document
    .getElementById("arquivoBackup")
    .addEventListener(
        "change",
        restaurarBackup
    );


function restaurarBackup(event) {

    const arquivo =
        event.target.files[0];

    if (!arquivo) return;


    const leitor = new FileReader();


    leitor.onload = function(e) {

        try {

            const backup =
                JSON.parse(e.target.result);


            if (
                !backup ||
                !Array.isArray(backup.dados)
            ) {

                throw new Error(
                    "Backup inválido."
                );

            }


            if (
                backup.tipo &&
                backup.tipo !== "COF_NORMAL"
            ) {

                alert(
                    "Esse backup não é do COF NORMAL."
                );

                return;
            }


            if (
                !confirm(
                    "Restaurar este backup? Os dados atuais serão substituídos."
                )
            ) {
                return;
            }


            dias = backup.dados;

            salvarDados();

            diaAtualId = null;

            fotoTemporaria = "";

            cofEditandoId = null;


            mostrarMensagem(
                "Backup restaurado!"
            );


            telaInicial();


        } catch (erro) {

            console.error(erro);

            alert(
                "Não foi possível restaurar o backup."
            );

        }

    };


    leitor.readAsText(arquivo);


    event.target.value = "";
}


/* =========================
   INICIAR
========================= */

carregarDados();

telaInicial();

</script>
