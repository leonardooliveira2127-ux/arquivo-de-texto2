
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COF Normal</title>

<style>

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body {
    touch-action:manipulation;
}

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef1f5;
    color:#1f2937;
}

button,
input {
    font:inherit;
}

button {
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
}

header {
    background:#111827;
    color:white;
    padding:16px;
    position:sticky;
    top:0;
    z-index:20;
}

.header {
    max-width:700px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo {
    font-size:22px;
    font-weight:bold;
}

main {
    max-width:700px;
    margin:auto;
    padding:14px;
}

.btn {
    border:0;
    border-radius:11px;
    padding:13px 15px;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled,
.adicionar:disabled,
.foto-btn:disabled {
    opacity:.55;
    pointer-events:none;
}

.btn-primary {
    width:100%;
    background:#2563eb;
    color:white;
}

.btn-secondary {
    background:#e5e7eb;
    color:#111827;
}

.btn-danger {
    background:#fee2e2;
    color:#b91c1c;
}

.btn-green {
    background:#dcfce7;
    color:#166534;
}

.titulo-area {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
}

.titulo-area h2 {
    margin:0;
    font-size:20px;
}

.dias {
    display:flex;
    flex-direction:column;
    gap:10px;
}

.dia-card {
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    cursor:pointer;
    border:1px solid #e5e7eb;
}

.dia-topo {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.dia-data {
    font-size:18px;
    font-weight:bold;
}

.seta {
    font-size:22px;
    color:#6b7280;
}

.dia-info {
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.tag {
    padding:6px 9px;
    border-radius:8px;
    background:#f3f4f6;
    font-size:13px;
    font-weight:bold;
}

.tag-blue {
    background:#dbeafe;
    color:#1d4ed8;
}

.tag-green {
    background:#dcfce7;
    color:#15803d;
}

.tag-gray {
    background:#f3f4f6;
    color:#4b5563;
}

.vazio {
    text-align:center;
    padding:35px 15px;
    color:#6b7280;
    background:white;
    border-radius:15px;
}

.card {
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.card h2 {
    margin:0 0 14px;
    font-size:18px;
}

label {
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input[type="date"],
input[type="text"],
input[type="number"] {
    width:100%;
    height:48px;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:0 12px;
    outline:none;
    background:#fafafa;
}

input:focus {
    border-color:#2563eb;
    background:white;
}

.campo {
    margin-bottom:13px;
}

.foto-btn {
    width:100%;
    height:48px;
    border:2px dashed #9ca3af;
    border-radius:10px;
    background:#f9fafb;
    font-weight:bold;
}

.preview {
    display:none;
    width:100%;
    max-height:200px;
    object-fit:contain;
    margin-top:10px;
    border-radius:10px;
    background:#f3f4f6;
}

.voltar {
    margin-bottom:12px;
}

.dia-header {
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.dia-header-top {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.dia-header h2 {
    margin:0;
}

.foto-dia {
    width:100%;
    max-height:180px;
    object-fit:contain;
    border-radius:10px;
    margin-top:12px;
    background:#f3f4f6;
}

.inputs-grid {
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:7px;
}

.campo-mini label {
    text-align:center;
}

.campo-mini input {
    text-align:center;
}

.adicionar {
    width:100%;
    height:54px;
    margin-top:12px;
    border:0;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.tabela-header,
.linha {
    display:grid;
    grid-template-columns:32px 1.5fr 1fr 1fr 35px;
    gap:5px;
    align-items:center;
}

.tabela-header {
    color:#6b7280;
    font-size:12px;
    font-weight:bold;
    padding:0 5px 6px;
}

.linha {
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:8px 5px;
    margin-bottom:7px;
}

.linha span {
    text-align:center;
}

.numero {
    color:#6b7280;
    font-size:12px;
}

.valor {
    font-weight:bold;
}

.excluir {
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:#fee2e2;
    color:#dc2626;
    font-weight:bold;
}

.acoes {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.backup-acoes {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}

.contador {
    background:#374151;
    padding:6px 10px;
    border-radius:20px;
    font-weight:bold;
}

.mensagem {
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:11px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:bold;
    z-index:9999;
    display:none;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

@media(max-width:500px) {

    main {
        padding:10px;
    }

    .titulo-area {
        align-items:center;
    }

    .inputs-grid {
        grid-template-columns:1.35fr 1fr 1fr;
    }

    .linha {
        grid-template-columns:28px 1.5fr 1fr 1fr 32px;
    }

    .tabela-header {
        grid-template-columns:28px 1.5fr 1fr 1fr 32px;
    }

    .linha,
    .campo-mini input {
        font-size:14px;
    }

}

</style>
</head>

<body>

<header>

<div class="header">

    <div class="logo">
        📋 COF Normal
    </div>

    <div id="contadorHeader" class="contador">
        0 dias
    </div>

</div>

</header>

<main id="app"></main>

<div id="mensagem" class="mensagem"></div>

<input
    id="arquivoBackup"
    type="file"
    accept=".json,application/json"
    hidden
>

<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let dias = [];

let diaAtualId = null;

let fotoTemporaria = "";

let acaoEmAndamento = false;


/* =====================================================
   CARREGAR DADOS
===================================================== */

function carregarDados() {

    try {

        const dados =
            localStorage.getItem(
                "cof_dias_normal"
            );

        if (!dados) {

            dias = [];

            return;
        }

        const convertido =
            JSON.parse(dados);

        dias =
            Array.isArray(convertido)
                ? convertido
                : [];

    } catch (erro) {

        console.error(
            "Erro ao carregar dados:",
            erro
        );

        dias = [];

    }

}


/* =====================================================
   SALVAR
===================================================== */

function salvarDados() {

    try {

        localStorage.setItem(
            "cof_dias_normal",
            JSON.stringify(dias)
        );

    } catch (erro) {

        console.error(
            "Erro ao salvar:",
            erro
        );

        mostrarMensagem(
            "⚠️ Não foi possível salvar os dados."
        );

    }

}


/* =====================================================
   MENSAGEM
===================================================== */

let mensagemTimer = null;

function mostrarMensagem(texto) {

    const elemento =
        document.getElementById(
            "mensagem"
        );

    if (!elemento) return;

    elemento.textContent =
        texto;

    elemento.style.display =
        "block";

    clearTimeout(
        mensagemTimer
    );

    mensagemTimer =
        setTimeout(() => {

            elemento.style.display =
                "none";

        }, 1800);

}


/* =====================================================
   BLOQUEIO DE DUPLO TOQUE
===================================================== */

function iniciarAcao() {

    if (acaoEmAndamento) {

        return false;

    }

    acaoEmAndamento = true;

    return true;
}


function finalizarAcao() {

    /*
     * Pequeno atraso para impedir
     * duplo toque no celular.
     */

    setTimeout(() => {

        acaoEmAndamento = false;

    }, 350);

}


/* =====================================================
   BACKUP
===================================================== */

function fazerBackup() {

    if (!iniciarAcao()) return;

    try {

        if (dias.length === 0) {

            alert(
                "Não há dados para fazer backup."
            );

            return;

        }

        const backup = {

            tipo:"COF_NORMAL",

            versao:2,

            dataBackup:
                new Date().toISOString(),

            dados:dias

        };

        const blob =
            new Blob(
                [
                    JSON.stringify(
                        backup,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json;charset=utf-8"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href =
            url;

        link.download =
            `BACKUP_COF_NORMAL_${dataHoje()}.json`;

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(() => {

            URL.revokeObjectURL(url);

        }, 1000);

        mostrarMensagem(
            "✅ Backup realizado!"
        );

    } finally {

        finalizarAcao();

    }

}


/* =====================================================
   RESTAURAR
===================================================== */

function selecionarBackup() {

    if (!iniciarAcao()) return;

    const input =
        document.getElementById(
            "arquivoBackup"
        );

    input.value = "";

    input.onchange =
        restaurarBackup;

    input.click();

    /*
     * Libera depois que o seletor
     * de arquivo abrir.
     */

    setTimeout(() => {

        acaoEmAndamento = false;

    }, 1000);

}


function restaurarBackup(event) {

    const arquivo =
        event.target.files[0];

    if (!arquivo) return;

    const leitor =
        new FileReader();

    leitor.onload =
        function(e) {

            try {

                const backup =
                    JSON.parse(
                        e.target.result
                    );

                if (
                    !backup.dados ||
                    !Array.isArray(
                        backup.dados
                    )
                ) {

                    throw new Error(
                        "Arquivo inválido"
                    );

                }

                if (
                    backup.tipo &&
                    backup.tipo !==
                        "COF_NORMAL"
                ) {

                    alert(
                        "Esse backup não é do COF Normal."
                    );

                    return;

                }

                if (
                    !confirm(
                        "Restaurar este backup?\n\n" +
                        "Os dados atuais serão substituídos."
                    )
                ) {

                    return;

                }

                dias =
                    backup.dados;

                salvarDados();

                diaAtualId =
                    null;

                telaInicial();

                mostrarMensagem(
                    "✅ Backup restaurado!"
                );

            } catch (erro) {

                console.error(
                    erro
                );

                alert(
                    "Não foi possível restaurar o backup."
                );

            } finally {

                event.target.value = "";

                acaoEmAndamento =
                    false;

            }

        };

    leitor.readAsText(
        arquivo
    );

}


/* =====================================================
   DATA
===================================================== */

function dataHoje() {

    const hoje =
        new Date();

    return hoje.getFullYear() +
        "-" +
        String(
            hoje.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            hoje.getDate()
        ).padStart(2,"0");

}


function formatarData(data) {

    if (!data) return "";

    const p =
        data.split("-");

    return `${p[2]}/${p[1]}/${p[0]}`;

}


/* =====================================================
   TELA INICIAL
===================================================== */

function telaInicial() {

    diaAtualId =
        null;

    document.getElementById(
        "contadorHeader"
    ).textContent =
        `${dias.length} ${
            dias.length === 1
                ? "dia"
                : "dias"
        }`;

    let html = `

        <div class="titulo-area">

            <h2>📅 Histórico</h2>

            <button
                type="button"
                class="btn btn-green"
                onclick="fazerBackup()"
            >
                💾 BACKUP
            </button>

        </div>

        <div class="backup-acoes">

            <button
                type="button"
                class="btn btn-secondary"
                onclick="selecionarBackup()"
            >
                ♻️ RESTAURAR
            </button>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="location.href='index.html'"
            >
                ← TIPOS
            </button>

        </div>

        <div
            class="dias"
            style="margin-top:12px;"
        >
    `;

    if (dias.length === 0) {

        html += `

            <div class="vazio">

                <div style="font-size:35px;">
                    📋
                </div>

                <p>
                    Nenhum dia cadastrado.
                </p>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="novoDia()"
                >
                    ＋ NOVO DIA
                </button>

            </div>

        `;

    } else {

        const ordenados =
            [...dias].sort(
                (a,b) =>
                    b.data.localeCompare(
                        a.data
                    )
            );

        ordenados.forEach(
            dia => {

                const total =
                    dia.registros
                        ? dia.registros.length
                        : 0;

                const totalFXF =
                    (dia.registros || [])
                    .reduce(
                        (s,r) =>
                            s +
                            (Number(r.fxf)||0),
                        0
                    );

                const totalVXV =
                    (dia.registros || [])
                    .reduce(
                        (s,r) =>
                            s +
                            (Number(r.vxv)||0),
                        0
                    );

                html += `

                    <div
                        class="dia-card"
                        onclick="abrirDia('${dia.id}')"
                    >

                        <div class="dia-topo">

                            <div class="dia-data">
                                📅 ${formatarData(
                                    dia.data
                                )}
                            </div>

                            <div class="seta">
                                ›
                            </div>

                        </div>

                        <div class="dia-info">

                            <span class="tag tag-blue">
                                ${total} COF
                            </span>

                            <span class="tag tag-green">
                                FXF: ${totalFXF}
                            </span>

                            <span class="tag tag-gray">
                                VXV: ${totalVXV}
                            </span>

                        </div>

                    </div>

                `;

            }
        );

    }

    html += `

        </div>

        <div style="margin-top:12px;">

            <button
                type="button"
                class="btn btn-primary"
                onclick="novoDia()"
            >
                ＋ NOVO DIA
            </button>

        </div>

    `;

    document.getElementById(
        "app"
    ).innerHTML =
        html;

}


/* =====================================================
   NOVO DIA
===================================================== */

function novoDia() {

    if (!iniciarAcao()) return;

    try {

        fotoTemporaria = "";

        document.getElementById(
            "app"
        ).innerHTML = `

            <button
                type="button"
                class="btn btn-secondary voltar"
                onclick="telaInicial()"
            >
                ← VOLTAR
            </button>

            <section class="card">

                <h2>📅 Novo dia</h2>

                <div class="campo">

                    <label>
                        Data
                    </label>

                    <input
                        id="novaData"
                        type="date"
                        value="${dataHoje()}"
                    >

                </div>

                <div class="campo">

                    <label>
                        Foto do produto
                    </label>

                    <input
                        id="novaFoto"
                        type="file"
                        accept="image/*"
                        hidden
                    >

                    <button
                        type="button"
                        class="foto-btn"
                        id="btnFoto"
                        onclick="abrirFoto()"
                    >
                        📷 Escolher foto
                    </button>

                    <img
                        id="previewNovo"
                        class="preview"
                    >

                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnCriarDia"
                    onclick="criarDia()"
                >
                    CRIAR DIA
                </button>

            </section>

        `;

        const inputFoto =
            document.getElementById(
                "novaFoto"
            );

        inputFoto.addEventListener(
            "change",
            selecionarFoto
        );

    } finally {

        finalizarAcao();

    }

}


/* =====================================================
   ABRIR FOTO
===================================================== */

function abrirFoto() {

    if (acaoEmAndamento) {

        /*
         * Não bloqueia a abertura
         * do seletor se já estiver
         * na tela de novo dia.
         */

    }

    const input =
        document.getElementById(
            "novaFoto"
        );

    if (input) {

        input.click();

    }

}


/* =====================================================
   SELECIONAR FOTO
===================================================== */

function selecionarFoto(event) {

    const arquivo =
        event.target.files[0];

    if (!arquivo) return;

    /*
     * Impede arquivos gigantes
     * de travarem o localStorage.
     */

    if (
        arquivo.size >
        5 * 1024 * 1024
    ) {

        alert(
            "A foto é muito grande.\n\n" +
            "Escolha uma foto de até 5 MB."
        );

        event.target.value =
            "";

        return;

    }

    const leitor =
        new FileReader();

    leitor.onload =
        function(e) {

            fotoTemporaria =
                e.target.result;

            const preview =
                document.getElementById(
                    "previewNovo"
                );

            if (preview) {

                preview.src =
                    fotoTemporaria;

                preview.style.display =
                    "block";

            }

            mostrarMensagem(
                "📷 Foto selecionada!"
            );

        };

    leitor.readAsDataURL(
        arquivo
    );

}


/* =====================================================
   CRIAR DIA
===================================================== */

function criarDia() {

    if (!iniciarAcao()) return;

    try {

        const campo =
            document.getElementById(
                "novaData"
            );

        if (!campo) return;

        const data =
            campo.value;

        if (!data) {

            alert(
                "Escolha a data."
            );

            return;

        }

        /*
         * Proteção extra:
         * não permite criar outro dia
         * com o mesmo ID.
         */

        const id =
            String(
                Date.now()
            );

        const dia = {

            id:id,

            data:data,

            foto:
                fotoTemporaria || "",

            registros:[]

        };

        dias.push(
            dia
        );

        salvarDados();

        /*
         * Só abre depois de salvar.
         */

        diaAtualId =
            id;

        mostrarMensagem(
            "✅ Dia criado!"
        );

        /*
         * Pequeno atraso para
         * o celular concluir o toque.
         */

        setTimeout(
            () => abrirDia(id),
            50
        );

    } finally {

        /*
         * Mantém bloqueado por
         * tempo suficiente para
         * impedir duplo toque.
         */

        setTimeout(
            () => {
                acaoEmAndamento =
                    false;
            },
            500
        );

    }

}


/* =====================================================
   ABRIR DIA
===================================================== */

function abrirDia(id) {

    const dia =
        dias.find(
            d => String(d.id) === String(id)
        );

    if (!dia) {

        telaInicial();

        return;

    }

    diaAtualId =
        id;

    document.getElementById(
        "contadorHeader"
    ).textContent =
        `${dia.registros.length} COF`;

    let html = `

        <button
            type="button"
            class="btn btn-secondary voltar"
            onclick="telaInicial()"
        >
            ← HISTÓRICO
        </button>

        <section class="dia-header">

            <div class="dia-header-top">

                <h2>
                    📅 ${formatarData(
                        dia.data
                    )}
                </h2>

                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="excluirDia('${dia.id}')"
                >
                    🗑️
                </button>

            </div>

    `;

    if (dia.foto) {

        html += `

            <img
                class="foto-dia"
                src="${dia.foto}"
            >

        `;

    }

    html += `

        </section>

        <section class="card">

            <h2>
                ➕ Adicionar COF
            </h2>

            <div class="inputs-grid">

                <div class="campo-mini">

                    <label>
                        BOBINA
                    </label>

                    <input
                        id="bobina"
                        type="text"
                        inputmode="text"
                        autocomplete="off"
                        autocapitalize="characters"
                        placeholder="Bobina"
                    >

                </div>

                <div class="campo-mini">

                    <label>
                        FXF
                    </label>

                    <input
                        id="fxf"
                        type="number"
                        inputmode="decimal"
                        placeholder="FXF"
                    >

                </div>

                <div class="campo-mini">

                    <label>
                        VXV
                    </label>

                    <input
                        id="vxv"
                        type="number"
                        inputmode="decimal"
                        placeholder="VXV"
                    >

                </div>

            </div>

            <button
                type="button"
                class="adicionar"
                id="btnAdicionar"
                onclick="adicionarCOF()"
            >
                ＋ ADICIONAR
            </button>

        </section>

        <section class="card">

            <h2>
                📋 COF deste dia
            </h2>

            <div id="listaCOF">

    `;

    if (
        !dia.registros ||
        dia.registros.length === 0
    ) {

        html += `

            <div class="vazio">
                Nenhum COF registrado ainda.
            </div>

        `;

    } else {

        html +=
            gerarTabela(dia);

    }

    html += `

            </div>

        </section>

        <section class="card">

            <div class="acoes">

                <button
                    type="button"
                    class="btn btn-green"
                    onclick="exportarDiaCSV('${dia.id}')"
                >
                    📊 PLANILHA
                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="limparCOF('${dia.id}')"
                >
                    🗑️ LIMPAR COF
                </button>

            </div>

        </section>

    `;

    document.getElementById(
        "app"
    ).innerHTML =
        html;

    configurarEnter();

    const bobina =
        document.getElementById(
            "bobina"
        );

    if (bobina) {

        setTimeout(
            () => bobina.focus(),
            100
        );

    }

}


/* =====================================================
   TABELA
===================================================== */

function gerarTabela(dia) {

    let html = `

        <div class="tabela-header">

            <span>#</span>

            <span>BOBINA</span>

            <span>FXF</span>

            <span>VXV</span>

            <span></span>

        </div>

    `;

    dia.registros.forEach(
        (r,index) => {

            html += `

                <div class="linha">

                    <span class="numero">
                        ${index+1}
                    </span>

                    <span class="valor">
                        ${escapar(
                            r.bobina
                        )}
                    </span>

                    <span>
                        ${
                            r.fxf || "-"
                        }
                    </span>

                    <span>
                        ${
                            r.vxv || "-"
                        }
                    </span>

                    <button
                        type="button"
                        class="excluir"
                        onclick="excluirCOF(${r.id})"
                    >
                        ×
                    </button>

                </div>

            `;

        }
    );

    return html;

}


/* =====================================================
   ADICIONAR COF
===================================================== */

function adicionarCOF() {

    if (!iniciarAcao()) return;

    try {

        const dia =
            dias.find(
                d =>
                    String(d.id) ===
                    String(diaAtualId)
            );

        if (!dia) return;

        const bobinaElemento =
            document.getElementById(
                "bobina"
            );

        const fxfElemento =
            document.getElementById(
                "fxf"
            );

        const vxvElemento =
            document.getElementById(
                "vxv"
            );

        if (
            !bobinaElemento ||
            !fxfElemento ||
            !vxvElemento
        ) {

            return;

        }

        const bobina =
            bobinaElemento.value.trim();

        const fxf =
            fxfElemento.value.trim();

        const vxv =
            vxvElemento.value.trim();

        if (!bobina) {

            alert(
                "Digite a bobina."
            );

            bobinaElemento.focus();

            return;

        }

        if (
            fxf === "" &&
            vxv === ""
        ) {

            alert(
                "Digite FXF ou VXV."
            );

            return;

        }

        /*
         * Cria um ID realmente único.
         */

        const id =
            String(
                Date.now()
            ) +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8);

        dia.registros.push({

            id:id,

            bobina:bobina,

            fxf:fxf,

            vxv:vxv

        });

        salvarDados();

        /*
         * Limpa os campos antes
         * de reconstruir a tela.
         */

        mostrarMensagem(
            "✅ COF adicionado!"
        );

        abrirDia(
            dia.id
        );

    } finally {

        setTimeout(
            () => {

                acaoEmAndamento =
                    false;

            },
            500
        );

    }

}


/* =====================================================
   ENTER
===================================================== */

function configurarEnter() {

    const bobina =
        document.getElementById(
            "bobina"
        );

    const fxf =
        document.getElementById(
            "fxf"
        );

    const vxv =
        document.getElementById(
            "vxv"
        );

    if (!bobina ||
        !fxf ||
        !vxv) {

        return;

    }

    /*
     * Evita criar vários listeners
     * se a tela for aberta novamente.
     */

    bobina.onkeydown =
        function(e) {

            if (
                e.key === "Enter"
            ) {

                e.preventDefault();

                fxf.focus();

            }

        };

    fxf.onkeydown =
        function(e) {

            if (
                e.key === "Enter"
            ) {

                e.preventDefault();

                vxv.focus();

            }

        };

    vxv.onkeydown =
        function(e) {

            if (
                e.key === "Enter"
            ) {

                e.preventDefault();

                adicionarCOF();

            }

        };

}


/* =====================================================
   EXCLUIR COF
===================================================== */

function excluirCOF(id) {

    if (!iniciarAcao()) return;

    try {

        const dia =
            dias.find(
                d =>
                    String(d.id) ===
                    String(diaAtualId)
            );

        if (!dia) return;

        if (
            !confirm(
                "Excluir este COF?"
            )
        ) {

            return;

        }

        dia.registros =
            dia.registros.filter(
                r =>
                    String(r.id) !==
                    String(id)
            );

        salvarDados();

        abrirDia(
            dia.id
        );

    } finally {

        finalizarAcao();

    }

}


/* =====================================================
   LIMPAR COF
===================================================== */

function limparCOF(id) {

    if (!iniciarAcao()) return;

    try {

        const dia =
            dias.find(
                d =>
                    String(d.id) ===
                    String(id)
            );

        if (!dia) return;

        if (
            !confirm(
                "Apagar todos os COF deste dia?"
            )
        ) {

            return;

        }

        dia.registros = [];

        salvarDados();

        abrirDia(
            dia.id
        );

    } finally {

        finalizarAcao();

    }

}


/* =====================================================
   EXCLUIR DIA
===================================================== */

function excluirDia(id) {

    if (!iniciarAcao()) return;

    try {

        if (
            !confirm(
                "Excluir este dia inteiro?"
            )
        ) {

            return;

        }

        dias =
            dias.filter(
                d =>
                    String(d.id) !==
                    String(id)
            );

        salvarDados();

        telaInicial();

        mostrarMensagem(
            "🗑️ Dia excluído!"
        );

    } finally {

        finalizarAcao();

    }

}


/* =====================================================
   EXPORTAR CSV
===================================================== */

function exportarDiaCSV(id) {

    if (!iniciarAcao()) return;

    try {

        const dia =
            dias.find(
                d =>
                    String(d.id) ===
                    String(id)
            );

        if (
            !dia ||
            !dia.registros ||
            dia.registros.length === 0
        ) {

            alert(
                "Não há COF para exportar."
            );

            return;

        }

        let csv =
            "BOBINA;FXF;VXV\n";

        dia.registros.forEach(
            r => {

                csv +=
                    `"${escaparCSV(
                        r.bobina
                    )}";` +
                    `"${escaparCSV(
                        r.fxf
                    )}";` +
                    `"${escaparCSV(
                        r.vxv
                    )}"\n`;

            }
        );

        const blob =
            new Blob(
                [
                    "\ufeff" +
                    csv
                ],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement(
                "a"
            );

        link.href =
            url;

        link.download =
            `COF_${dia.data}.csv`;

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();

        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

        mostrarMensagem(
            "📊 Planilha gerada!"
        );

    } finally {

        finalizarAcao();

    }

}


/* =====================================================
   CSV
===================================================== */

function escaparCSV(valor) {

    return String(
        valor ?? ""
    )
    .replaceAll(
        '"',
        '""'
    );

}


/* =====================================================
   SEGURANÇA
===================================================== */

function escapar(texto) {

    return String(
        texto ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================================
   INICIAR
===================================================== */

carregarDados();

telaInicial();

</script>
