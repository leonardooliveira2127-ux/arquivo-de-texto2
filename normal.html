<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle COF</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef1f5;
            color: #1f2937;
        }

        button,
        input {
            font: inherit;
        }

        header {
            width: 100%;
            background: #111827;
            color: white;
            position: relative;
            z-index: 20;
        }

        /* Banner substituível: proporção 1920 x 600 (3,2:1) */
        .banner {
            position: relative;
            width: 100%;
            aspect-ratio: 1920 / 600;
            min-height: 110px;
            max-height: 600px;
            overflow: hidden;
            background: linear-gradient(135deg, #1f2937, #374151);
        }

        .banner-imagem {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .banner-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            color: #d1d5db;
            text-align: center;
            font-size: clamp(12px, 2vw, 18px);
            letter-spacing: .04em;
            background: repeating-linear-gradient(
                135deg,
                rgba(255,255,255,.025) 0,
                rgba(255,255,255,.025) 12px,
                transparent 12px,
                transparent 24px
            );
        }

        .banner-conteudo {
            position: absolute;
            inset: auto 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px max(14px, calc((100% - 700px) / 2));
            background: linear-gradient(transparent, rgba(0,0,0,.72));
        }

        .logo {
            font-size: clamp(17px, 2.2vw, 24px);
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0,0,0,.65);
        }

        .contador {
            flex-shrink: 0;
            background: rgba(17, 24, 39, .82);
            padding: 7px 11px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 14px;
        }

        /* =========================
           BOTÕES
        ========================= */

        .btn {
            border: 0;
            border-radius: 11px;
            padding: 13px 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-green {
            background: #dcfce7;
            color: #166534;
        }

        /* =========================
           TELA INICIAL
        ========================= */

        .titulo-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .titulo-area h2 {
            margin: 0;
            font-size: 20px;
        }

        .btn-backup {
            white-space: nowrap;
            padding: 10px 13px;
        }

        .dias {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dia-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
            cursor: pointer;
            border: 1px solid #e5e7eb;
        }

        .dia-card:active {
            transform: scale(.99);
        }

        .dia-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dia-data {
            font-size: 18px;
            font-weight: bold;
        }

        .seta {
            font-size: 22px;
            color: #6b7280;
        }

        .dia-info {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            padding: 6px 9px;
            border-radius: 8px;
            background: #f3f4f6;
            font-size: 13px;
            font-weight: bold;
        }

        .tag-blue {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .tag-green {
            background: #dcfce7;
            color: #15803d;
        }

        .tag-gray {
            background: #f3f4f6;
            color: #4b5563;
        }

        .vazio {
            text-align: center;
            padding: 35px 15px;
            color: #6b7280;
            background: white;
            border-radius: 15px;
        }

        /* =========================
           FORMULÁRIO NOVO DIA
        ========================= */

        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 13px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="date"],
        input[type="text"],
        input[type="number"] {
            width: 100%;
            height: 48px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 12px;
            outline: none;
            background: #fafafa;
        }

        input:focus {
            border-color: #2563eb;
            background: white;
        }

        .campo {
            margin-bottom: 13px;
        }

        .foto-btn {
            width: 100%;
            height: 48px;
            border: 2px dashed #9ca3af;
            border-radius: 10px;
            background: #f9fafb;
            font-weight: bold;
        }

        .preview {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 10px;
            background: #f3f4f6;
        }

        /* =========================
           TELA DO DIA
        ========================= */

        .voltar {
            margin-bottom: 12px;
        }

        .dia-header {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 13px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
        }

        .dia-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dia-header h2 {
            margin: 0;
        }

        .foto-dia {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 12px;
            background: #f3f4f6;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 7px;
        }

        .campo-mini label {
            text-align: center;
        }

        .campo-mini input {
            text-align: center;
        }

        .adicionar {
            width: 100%;
            height: 54px;
            margin-top: 12px;
            border: 0;
            border-radius: 11px;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .tabela-header,
        .linha {
            display: grid;
            grid-template-columns: 28px 1.5fr 1fr 1fr 35px 35px;
            gap: 5px;
            align-items: center;
        }

        .tabela-header {
            color: #6b7280;
            font-size: 12px;
            font-weight: bold;
            padding: 0 5px 6px;
        }

        .linha {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 8px 5px;
            margin-bottom: 7px;
        }

        .linha span {
            text-align: center;
        }

        .numero {
            color: #6b7280;
            font-size: 12px;
        }

        .valor {
            font-weight: bold;
        }

        .excluir {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 8px;
            background: #fee2e2;
            color: #dc2626;
            font-weight: bold;
        }

        .editar {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 8px;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: bold;
        }

        .acoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 500px) {

            .banner {
                min-height: 105px;
            }

            .banner-conteudo {
                padding: 10px;
                gap: 6px;
            }

            .contador {
                padding: 5px 8px;
                font-size: 12px;
            }

            main {
                padding: 10px;
            }

            .titulo-area {
                align-items: center;
            }

            .titulo-area h2 {
                font-size: 18px;
            }

            .btn-backup {
                padding: 10px;
                font-size: 13px;
            }

            .inputs-grid {
                grid-template-columns: 1.35fr 1fr 1fr;
            }

            .linha {
                grid-template-columns: 25px 1.5fr 1fr 1fr 32px 32px;
            }

            .tabela-header {
                grid-template-columns: 25px 1.5fr 1fr 1fr 32px 32px;
            }

            .linha,
            .campo-mini input {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="banner">
            <div id="bannerPlaceholder" class="banner-placeholder">
                SUA IMAGEM AQUI · 1920 × 600 PX
            </div>
            <img
                class="banner-imagem"
                src="img/Chevette.png"
                alt="Banner do Controle COF"
                onload="document.getElementById('bannerPlaceholder').style.display='none'"
                onerror="this.style.display='none'"
            >
            <div class="banner-conteudo">
                <div class="logo">📋 Controle COF</div>
                <div id="contadorHeader" class="contador">0 dias</div>
            </div>
        </div>
    </header>

    <main id="app"></main>

    <script>

        /* =====================================================
           DADOS
        ===================================================== */

        let dias = JSON.parse(
            localStorage.getItem("cof_dias")
        ) || [];

        let diaAtualId = null;

        let fotoTemporaria = "";
        let editingCOFId = null;


        /* =====================================================
           SALVAR AUTOMATICAMENTE
        ===================================================== */

        function salvarDados() {

            localStorage.setItem(
                "cof_dias",
                JSON.stringify(dias)
            );

        }


        /* =====================================================
           BACKUP
        ===================================================== */

        function fazerBackup() {

            if (dias.length === 0) {

                alert(
                    "Não há dados para fazer backup."
                );

                return;
            }


            const backup = {

                versao: 1,

                dataBackup:
                    new Date().toISOString(),

                dados:
                    dias

            };


            const json =
                JSON.stringify(
                    backup,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;


            link.download =
                `BACKUP_COF_${dataHoje()}.json`;


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            URL.revokeObjectURL(url);


            alert(
                "Backup realizado com sucesso!"
            );

        }


        /* =====================================================
           DATA DE HOJE
        ===================================================== */

        function dataHoje() {

            const hoje =
                new Date();

            const ano =
                hoje.getFullYear();

            const mes =
                String(
                    hoje.getMonth() + 1
                ).padStart(2, "0");

            const dia =
                String(
                    hoje.getDate()
                ).padStart(2, "0");

            return `${ano}-${mes}-${dia}`;

        }


        /* =====================================================
           FORMATAR DATA
        ===================================================== */

        function formatarData(data) {

            if (!data) return "";

            const p =
                data.split("-");

            return `${p[2]}/${p[1]}/${p[0]}`;

        }


        /* =====================================================
           TELA INICIAL
        ===================================================== */

        function telaInicial() {

            diaAtualId = null;


            const app =
                document.getElementById(
                    "app"
                );


            document.getElementById(
                "contadorHeader"
            ).textContent =
                `${dias.length} ${dias.length === 1 ? "dia" : "dias"}`;


            let html = `

                <div class="titulo-area">

                    <h2>
                        📅 Histórico
                    </h2>

                    <button
                        class="btn btn-green btn-backup"
                        onclick="fazerBackup()"
                    >
                        💾 BACKUP
                    </button>

                </div>

                <div class="dias">
            `;


            if (dias.length === 0) {

                html += `

                    <div class="vazio">

                        <div style="font-size:35px;">
                            📋
                        </div>

                        <p>
                            Nenhum dia cadastrado.
                        </p>

                        <button
                            class="btn btn-primary"
                            onclick="novoDia()"
                        >
                            ＋ NOVO DIA
                        </button>

                    </div>

                `;

            } else {

                // Mais recente primeiro

                const ordenados =
                    [...dias].sort(
                        (a, b) =>
                            b.data.localeCompare(
                                a.data
                            )
                    );


                ordenados.forEach(
                    dia => {

                        const total =
                            dia.registros.length;


                        const totalFXF =
                            dia.registros.reduce(
                                (soma, r) =>
                                    soma +
                                    (Number(r.fxf) || 0),
                                0
                            );


                        const totalVXV =
                            dia.registros.reduce(
                                (soma, r) =>
                                    soma +
                                    (Number(r.vxv) || 0),
                                0
                            );


                        html += `

                            <div
                                class="dia-card"
                                onclick="abrirDia('${dia.id}')"
                            >

                                <div class="dia-topo">

                                    <div class="dia-data">
                                        📅 ${formatarData(dia.data)}
                                    </div>

                                    <div class="seta">
                                        ›
                                    </div>

                                </div>

                                <div class="dia-info">

                                    <span class="tag tag-blue">
                                        ${total} COF
                                    </span>

                                    <span class="tag tag-green">
                                        FXF: ${totalFXF}
                                    </span>

                                    <span class="tag tag-gray">
                                        VXV: ${totalVXV}
                                    </span>

                                </div>

                            </div>

                        `;

                    }
                );

            }


            html += `

                </div>

                <div style="margin-top:12px;">

                    <button
                        class="btn btn-primary"
                        onclick="novoDia()"
                    >
                        ＋ NOVO DIA
                    </button>

                </div>

            `;


            app.innerHTML =
                html;

        }


        /* =====================================================
           NOVO DIA
        ===================================================== */

        function novoDia() {

            fotoTemporaria = "";


            document.getElementById(
                "app"
            ).innerHTML = `

                <button
                    class="btn btn-secondary voltar"
                    onclick="telaInicial()"
                >
                    ← VOLTAR
                </button>

                <section class="card">

                    <h2>
                        📅 Novo dia
                    </h2>

                    <div class="campo">

                        <label>
                            Data
                        </label>

                        <input
                            id="novaData"
                            type="date"
                            value="${dataHoje()}"
                        >

                    </div>


                    <div class="campo">

                        <label>
                            Foto do produto
                        </label>

                        <input
                            id="novaFoto"
                            type="file"
                            accept="image/*"
                            hidden
                            onchange="selecionarFoto(event)"
                        >

                        <button
                            class="foto-btn"
                            onclick="document.getElementById('novaFoto').click()"
                        >
                            📷 Escolher foto
                        </button>

                        <img
                            id="previewNovo"
                            class="preview"
                        >

                    </div>


                    <button
                        class="btn btn-primary"
                        onclick="criarDia()"
                    >
                        CRIAR DIA
                    </button>

                </section>

            `;

        }


        /* =====================================================
           FOTO
        ===================================================== */

        function selecionarFoto(event) {

            const arquivo =
                event.target.files[0];


            if (!arquivo) return;


            const leitor =
                new FileReader();


            leitor.onload =
                function (e) {

                    fotoTemporaria =
                        e.target.result;


                    const preview =
                        document.getElementById(
                            "previewNovo"
                        );


                    preview.src =
                        fotoTemporaria;


                    preview.style.display =
                        "block";

                };


            leitor.readAsDataURL(
                arquivo
            );

        }


        /* =====================================================
           CRIAR DIA
        ===================================================== */

        function criarDia() {

            const data =
                document.getElementById(
                    "novaData"
                ).value;


            if (!data) {

                alert(
                    "Escolha a data."
                );

                return;

            }


            const dia = {

                id:
                    Date.now().toString(),

                data:
                    data,

                foto:
                    fotoTemporaria,

                registros:
                    []

            };


            dias.push(
                dia
            );


            salvarDados();


            abrirDia(
                dia.id
            );

        }


        /* =====================================================
           ABRIR DIA
        ===================================================== */

        function abrirDia(id) {

            editingCOFId = null;

            const dia =
                dias.find(
                    d => d.id === id
                );


            if (!dia) {

                telaInicial();

                return;

            }


            diaAtualId =
                id;


            document.getElementById(
                "contadorHeader"
            ).textContent =
                `${dia.registros.length} COF`;


            const app =
                document.getElementById(
                    "app"
                );


            let html = `

                <button
                    class="btn btn-secondary voltar"
                    onclick="telaInicial()"
                >
                    ← HISTÓRICO
                </button>


                <section class="dia-header">

                    <div class="dia-header-top">

                        <h2>
                            📅 ${formatarData(dia.data)}
                        </h2>

                        <button
                            class="btn btn-danger"
                            onclick="excluirDia('${dia.id}')"
                        >
                            🗑️
                        </button>

                    </div>

            `;


            if (dia.foto) {

                html += `

                    <img
                        class="foto-dia"
                        src="${dia.foto}"
                    >

                `;

            }


            html += `

                </section>


                <section class="card">

                    <h2>
                        ➕ Adicionar COF
                    </h2>

                    <div class="inputs-grid">

                        <div class="campo-mini">

                            <label>
                                BOBINA
                            </label>

                            <input
                                id="bobina"
                                type="text"
                                inputmode="numeric"
                                autocomplete="off"
                                placeholder="Bobina"
                            >

                        </div>


                        <div class="campo-mini">

                            <label>
                                FXF
                            </label>

                            <input
                                id="fxf"
                                type="text"
                                inputmode="decimal"
                                autocomplete="off"
                                placeholder="FXF"
                            >

                        </div>


                        <div class="campo-mini">

                            <label>
                                VXV
                            </label>

                            <input
                                id="vxv"
                                type="text"
                                inputmode="decimal"
                                autocomplete="off"
                                placeholder="VXV"
                            >

                        </div>

                    </div>


                    <button
                        id="btnSalvarCOF"
                        class="adicionar"
                        onclick="adicionarCOF()"
                    >
                        ＋ ADICIONAR
                    </button>

                    <button
                        id="btnCancelarEdicao"
                        class="btn btn-secondary"
                        style="display:none;width:100%;margin-top:8px;"
                        onclick="cancelarEdicaoCOF()"
                    >
                        CANCELAR EDIÇÃO
                    </button>

                </section>


                <section class="card">

                    <h2>
                        📋 COF deste dia
                    </h2>

                    <div id="listaCOF">

            `;


            if (
                dia.registros.length === 0
            ) {

                html += `

                    <div class="vazio">
                        Nenhum COF registrado ainda.
                    </div>

                `;

            } else {

                html +=
                    gerarTabela(dia);

            }


            html += `

                    </div>

                </section>


                <section class="card">

                    <div class="acoes">

                        <button
                            class="btn btn-green"
                            onclick="exportarDiaCSV('${dia.id}')"
                        >
                            📊 PLANILHA
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="limparCOF('${dia.id}')"
                        >
                            🗑️ LIMPAR COF
                        </button>

                    </div>

                </section>

            `;


            app.innerHTML =
                html;


            const bobina =
                document.getElementById(
                    "bobina"
                );


            if (bobina) {

                bobina.focus();

                configurarEnter();

            }

        }


        /* =====================================================
           TABELA
        ===================================================== */

        function gerarTabela(dia) {

            let html = `

                <div class="tabela-header">

                    <span>#</span>

                    <span>BOBINA</span>

                    <span>FXF</span>

                    <span>VXV</span>

                    <span></span>
                    <span></span>

                </div>

            `;


            dia.registros.forEach(
                (r, index) => {

                    html += `

                        <div class="linha">

                            <span class="numero">
                                ${index + 1}
                            </span>

                            <span class="valor">
                                ${escapar(r.bobina)}
                            </span>

                            <span>
                                ${r.fxf || "-"}
                            </span>

                            <span>
                                ${r.vxv || "-"}
                            </span>

                            <button
                                class="editar"
                                title="Editar COF"
                                onclick="editarCOF(${r.id})"
                            >
                                ✎
                            </button>

                            <button
                                class="excluir"
                                title="Excluir COF"
                                onclick="excluirCOF(${r.id})"
                            >
                                ×
                            </button>

                        </div>

                    `;

                }
            );


            return html;

        }


        /* =====================================================
           ADICIONAR COF
        ===================================================== */

        function adicionarCOF() {

            const dia =
                dias.find(d => d.id === diaAtualId);

            if (!dia) return;

            const bobina =
                document.getElementById("bobina").value.trim();

            const fxf =
                document.getElementById("fxf").value.trim();

            const vxv =
                document.getElementById("vxv").value.trim();

            if (!bobina) {
                alert("Digite a bobina.");
                document.getElementById("bobina").focus();
                return;
            }

            if (fxf === "" && vxv === "") {
                alert("Digite FXF ou VXV.");
                return;
            }

            if (editingCOFId !== null) {
                const registro = dia.registros.find(r => r.id === editingCOFId);

                if (registro) {
                    registro.bobina = bobina;
                    registro.fxf = fxf;
                    registro.vxv = vxv;
                }

                editingCOFId = null;
            } else {
                dia.registros.push({
                    id: Date.now(),
                    bobina: bobina,
                    fxf: fxf,
                    vxv: vxv
                });
            }

            salvarDados();
            abrirDia(dia.id);
        }


        function editarCOF(id) {

            const dia = dias.find(d => d.id === diaAtualId);
            if (!dia) return;

            const registro = dia.registros.find(r => r.id === id);
            if (!registro) return;

            editingCOFId = id;

            document.getElementById("bobina").value = registro.bobina ?? "";
            document.getElementById("fxf").value = registro.fxf ?? "";
            document.getElementById("vxv").value = registro.vxv ?? "";

            document.getElementById("btnSalvarCOF").textContent = "💾 SALVAR ALTERAÇÕES";
            document.getElementById("btnCancelarEdicao").style.display = "block";

            document.getElementById("bobina").focus();
            document.querySelector(".card h2").scrollIntoView({ behavior: "smooth", block: "center" });
        }


        function cancelarEdicaoCOF() {

            editingCOFId = null;

            document.getElementById("bobina").value = "";
            document.getElementById("fxf").value = "";
            document.getElementById("vxv").value = "";

            document.getElementById("btnSalvarCOF").textContent = "＋ ADICIONAR";
            document.getElementById("btnCancelarEdicao").style.display = "none";

            document.getElementById("bobina").focus();
        }


        /* =====================================================
           ENTER
        ===================================================== */

        function configurarEnter() {

            const bobina =
                document.getElementById(
                    "bobina"
                );


            const fxf =
                document.getElementById(
                    "fxf"
                );


            const vxv =
                document.getElementById(
                    "vxv"
                );


            bobina.addEventListener(
                "keydown",
                e => {

                    if (
                        e.key === "Enter"
                    ) {

                        fxf.focus();

                    }

                }
            );


            fxf.addEventListener(
                "keydown",
                e => {

                    if (
                        e.key === "Enter"
                    ) {

                        vxv.focus();

                    }

                }
            );


            vxv.addEventListener(
                "keydown",
                e => {

                    if (
                        e.key === "Enter"
                    ) {

                        adicionarCOF();

                    }

                }
            );

        }


        /* =====================================================
           EXCLUIR COF
        ===================================================== */

        function excluirCOF(id) {

            const dia =
                dias.find(
                    d => d.id === diaAtualId
                );


            if (!dia) return;


            if (
                !confirm(
                    "Excluir este COF?"
                )
            ) {

                return;

            }


            dia.registros =
                dia.registros.filter(
                    r => r.id !== id
                );


            salvarDados();


            abrirDia(
                dia.id
            );

        }


        /* =====================================================
           LIMPAR COF DO DIA
        ===================================================== */

        function limparCOF(id) {

            const dia =
                dias.find(
                    d => d.id === id
                );


            if (!dia) return;


            if (
                !confirm(
                    "Apagar todos os COF deste dia?"
                )
            ) {

                return;

            }


            dia.registros = [];


            salvarDados();


            abrirDia(
                dia.id
            );

        }


        /* =====================================================
           EXCLUIR DIA
        ===================================================== */

        function excluirDia(id) {

            if (
                !confirm(
                    "Excluir este dia inteiro?"
                )
            ) {

                return;

            }


            dias =
                dias.filter(
                    d => d.id !== id
                );


            salvarDados();


            telaInicial();

        }


        /* =====================================================
           EXPORTAR DIA PARA EXCEL
        ===================================================== */

        function exportarDiaCSV(id) {

            const dia =
                dias.find(
                    d => d.id === id
                );


            if (
                !dia ||
                dia.registros.length === 0
            ) {

                alert(
                    "Não há COF para exportar."
                );

                return;

            }


            // Excel BR usa ; para separar as colunas

            let csv =
                "BOBINA;FXF;VXV\n";


            dia.registros.forEach(
                (r) => {

                    csv +=
                        `"${r.bobina}";` +
                        `"${r.fxf}";` +
                        `"${r.vxv}"\n`;

                }
            );


            const blob =
                new Blob(
                    ["\ufeff" + csv],
                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                `COF_${dia.data}.csv`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                url
            );

        }


        /* =====================================================
           SEGURANÇA
        ===================================================== */

        function escapar(texto) {

            return String(texto)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =====================================================
           INICIAR
        ===================================================== */

        telaInicial();

    </script>

</body>
