```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle COF</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f5;
    color: #1f2937;
}

main {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;
    font-size: 32px;
}

.logo p {
    margin-top: 8px;
    color: #6b7280;
}

.opcoes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px 18px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    cursor: pointer;
    border: 2px solid transparent;
    transition: .15s;
}

.card:active {
    transform: scale(.97);
}

.card:hover {
    border-color: #2563eb;
}

.icone {
    font-size: 50px;
    margin-bottom: 12px;
}

.card h2 {
    margin: 0 0 8px;
}

.card p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
}

.download-area {
    margin-top: 18px;
}

.btn-download {
    width: 100%;
    height: 55px;
    border: 0;
    border-radius: 12px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-download:active {
    transform: scale(.98);
}

.status {
    text-align: center;
    margin-top: 10px;
    min-height: 20px;
    color: #6b7280;
    font-size: 13px;
}

@media (max-width: 500px) {

    .opcoes {
        grid-template-columns: 1fr;
    }

    .logo h1 {
        font-size: 27px;
    }

}

</style>

<!-- Biblioteca para criar ZIP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>

<body>

<main>

    <div class="container">

        <div class="logo">

            <div style="font-size:55px;">
                📊
            </div>

            <h1>
                Controle COF
            </h1>

            <p>
                Escolha o tipo de análise
            </p>

        </div>


        <div class="opcoes">

            <!-- COF NORMAL -->

            <div
                class="card"
                onclick="location.href='normal.html'"
            >

                <div class="icone">
                    📋
                </div>

                <h2>
                    COF NORMAL
                </h2>

                <p>
                    Controle padrão de COF
                </p>

            </div>


            <!-- COF TMI -->

            <div
                class="card"
                onclick="location.href='tmi.html'"
            >

                <div class="icone">
                    📊
                </div>

                <h2>
                    COF TMI
                </h2>

                <p>
                    Controle de análise TMI
                </p>

            </div>

        </div>


        <!-- DOWNLOAD DO SISTEMA -->

        <div class="download-area">

            <button
                class="btn-download"
                onclick="baixarSistema()"
            >
                📦 BAIXAR SISTEMA
            </button>

            <div
                id="status"
                class="status"
            ></div>

        </div>

    </div>

</main>


<script>

async function baixarSistema() {

    const status =
        document.getElementById("status");

    try {

        status.textContent =
            "⏳ Preparando o sistema...";


        if (
            typeof JSZip === "undefined"
        ) {

            throw new Error(
                "Biblioteca ZIP não carregada."
            );

        }


        const zip =
            new JSZip();


        /*
         * Pega os três arquivos que estão
         * na mesma pasta do index.html.
         */

        const arquivos = [
            "index.html",
            "normal.html",
            "tmi.html"
        ];


        for (
            const arquivo of arquivos
        ) {

            status.textContent =
                `⏳ Adicionando ${arquivo}...`;


            const resposta =
                await fetch(arquivo);


            if (!resposta.ok) {

                throw new Error(
                    `Não foi possível encontrar ${arquivo}`
                );

            }


            const conteudo =
                await resposta.text();


            zip.file(
                arquivo,
                conteudo
            );

        }


        status.textContent =
            "📦 Criando arquivo ZIP...";


        const blob =
            await zip.generateAsync({

                type: "blob",

                compression: "DEFLATE",

                compressionOptions: {
                    level: 9
                }

            });


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "COF-SISTEMA.zip";


        document.body.appendChild(link);

        link.click();

        link.remove();


        URL.revokeObjectURL(url);


        status.textContent =
            "✅ Sistema baixado!";


    } catch (erro) {

        console.error(erro);

        status.innerHTML =
            "❌ Não foi possível criar o ZIP.<br>" +
            "Abra o sistema por um servidor/local host para usar esta função.";

    }

}

</script>

</body>

</html>
```
